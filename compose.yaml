services:
  cabbage:
    build:
      context: .
      args:
        # 可用环境变量覆盖：PYTHON_VERSION=3.11 docker compose build
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
    image: cabbage-panel:1.0.0
    container_name: cabbage-panel
    ports:
      - "5700:5700"
    volumes:
      - cabbage-data:/app/data
    environment:
      TZ: Asia/Shanghai
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  cabbage-data:
