services:
  cabbage:
    build:
      context: .
      args:
        # 源码来源：构建时从 GitHub 下载完整 tarball，不使用本地源码目录。
        # 这样服务器上的源码树不完整也不影响构建。
        # 指定版本：SOURCE_REF=v1.0.1 docker compose build
        SOURCE_REPO: ${SOURCE_REPO:-bucai2417/cabbage-panel}
        SOURCE_REF: ${SOURCE_REF:-main}
        # 可用环境变量覆盖：PYTHON_VERSION=3.11 docker compose build
        PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
        # 基础镜像仓库前缀，默认已内置 1ms 加速站，国内可直接构建。
        # 境外网络或想换站时覆盖，例如：
        #   DOCKER_MIRROR=docker.m.daocloud.io/library/ docker compose build
        #   DOCKER_MIRROR= docker compose build   # 空值 = 直连 Docker Hub
        # 注意用 ${VAR-默认}（无冒号）：只有未设置才回落默认，显式空值保留。
        DOCKER_MIRROR: ${DOCKER_MIRROR-docker.1ms.run/}
        # 构建工具链：Node / Go 从国内镜像下二进制，不走 node/golang 官方镜像。
        NODE_VERSION: ${NODE_VERSION:-24.22.3}
        GO_VERSION: ${GO_VERSION:-1.27.4}
        NODE_MIRROR: ${NODE_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/nodejs-release}
        GO_MIRROR: ${GO_MIRROR:-https://mirrors.aliyun.com/golang}
        # 构建依赖源默认走国内；境外网络可在 .env 或命令行覆盖为官方源。
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
    image: cabbage-panel:1.0.1
    container_name: cabbage-panel
    ports:
      - "5700:5700"
    volumes:
      # 相对路径以本文件所在目录为基准，Compose 会解析成该目录下的 data 绝对路径，
      # 不会落到 /var/lib/docker/volumes。
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 运行身份全自动：入口脚本读取数据目录的宿主机属主并据此运行，无需配置。
      # 只有想强制指定时才在 .env 里设 PUID/PGID（留空即自动）。
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
