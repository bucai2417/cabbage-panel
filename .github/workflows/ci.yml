name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go vet ./...
      - run: go test -race ./... -count=1 -timeout 180s
      - run: CGO_ENABLED=0 go build -trimpath -o dist/cabbage ./cmd/cabbage
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
        env:
          CABBAGE_TEST_BINARY: ../dist/cabbage
